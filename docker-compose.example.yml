services:
  observatory:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./runtime:/app/runtime
      # command-mode Codex Exec requires the executable/auth/config to exist in the container.
      # If your executor is external, use PELICAN_EXEC_MODE=http instead.
